name: HustleHub+ CI Pipeline

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ==========================================
  # BACKEND CI
  # ==========================================

  backend:
    name: Backend Tests, Security, Lint and Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: api

    env:
      JWT_SECRET: ci-only-test-secret-not-for-production
      NODE_ENV: test

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Audit backend dependencies
        run: npm audit --audit-level=high

      - name: Run backend automated tests
        run: npm test

      - name: Run backend static analysis
        run: npm run lint

      - name: Validate backend build
        run: npm run build


  # ==========================================
  # FRONTEND CI
  # ==========================================

  frontend:
    name: Frontend Tests, Security, Lint and Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: client

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Run frontend automated tests
        run: npm run test:run

      - name: Run frontend static analysis
        run: npm run lint

      - name: Build frontend application
        run: npm run build


  # ==========================================
  # DOCKER + API INTEGRATION TESTING
  # ==========================================

  integration:
    name: Docker Build and Newman API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    needs:
      - backend
      - frontend

    env:
      MONGO_ROOT_USERNAME: ci-root
      MONGO_ROOT_PASSWORD: ci-only-mongo-password
      JWT_SECRET: ci-only-test-secret-not-for-production
      TAX_ESTIMATE_RATE: "0.20"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Newman dependencies
        run: npm ci

      - name: Audit Newman test tooling
        run: npm audit --audit-level=critical

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build backend and frontend Docker images
        run: docker compose build api frontend

      - name: Start MongoDB, backend and frontend
        run: docker compose up --detach --wait --wait-timeout 180

      - name: Verify API readiness
        run: |
          curl --fail --silent --show-error \
            --retry 10 \
            --retry-delay 3 \
            --retry-connrefused \
            http://localhost:8080/api/health/ready

      - name: Verify frontend availability
        run: |
          curl --fail --silent --show-error \
            --retry 10 \
            --retry-delay 3 \
            --retry-connrefused \
            http://localhost:8080/

      - name: Run Newman API regression tests
        run: |
          npm run test:api -- \
            --env-var "baseUrl=http://localhost:8080" \
            --reporters cli

      - name: Display Docker container status
        if: always()
        run: docker compose ps

      - name: Collect Docker logs if a step fails
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Stop Docker services
        if: always()
        run: docker compose down --remove-orphans