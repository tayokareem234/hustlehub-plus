services:

  # ==========================================
  # MONGODB DATABASE
  # ==========================================

  mongo:
    image: mongo:8.0

    container_name: hustlehub-mongodb

    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD}

    volumes:
      - mongodb_data:/data/db

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok"
        ]

      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  # ==========================================
  # EXPRESS BACKEND API
  # ==========================================

  api:
    build:
      context: ./api
      dockerfile: Dockerfile

    container_name: hustlehub-api

    restart: unless-stopped

    environment:
      PORT: 3000

      NODE_ENV: production

      HTTPS_ENABLED: "false"

      MONGODB_URI: "mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/hustlehub?authSource=admin"

      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}

      TAX_ESTIMATE_RATE: ${TAX_ESTIMATE_RATE:-0.20}

    depends_on:
      mongo:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]

      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  # ==========================================
  # REACT FRONTEND / NGINX
  # ==========================================

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile

    container_name: hustlehub-frontend

    restart: unless-stopped

    ports:
      - "8080:80"

    depends_on:
      api:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1/ || exit 1"
        ]

      interval: 10s
      timeout: 5s
      retries: 5


# ==========================================
# PERSISTENT DATABASE STORAGE
# ==========================================

volumes:
  mongodb_data: